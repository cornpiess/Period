name: Android APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android-lite/**
      - .github/workflows/android-apk.yml
      - scripts/verify-android-release.sh

jobs:
  # Android 仅发布轻量壳；继续使用原 Expo 大包的签名密钥。
  lite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-lite/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: cd android-lite && npm ci

      - name: Sync PWA into native project
        run: cd android-lite && npx cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-lite/android/app/period.keystore

      - name: Inject release signing config
        run: |
          cat >> android-lite/android/app/build.gradle <<'EOF'

          // CI signing config appended by workflow
          android {
              signingConfigs {
                  release {
                      storeFile file("period.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android-lite/android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Verify signing continuity and package identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/verify-android-release.sh

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android-lite/android/app/build/outputs/apk/release/*.apk | head -1)
          VN=$(grep -oP 'versionName "\K[^"]+' android-lite/android/app/build.gradle)
          cp "$APK" "Period-lite-$VN-android.apk"
          gh release view android-v1.0.0 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-v1.0.0 -R "$GITHUB_REPOSITORY" \
              --title "Period Android" \
              --notes "Period Android：轻量安装包，沿用原版包名与签名。"
          gh release upload android-v1.0.0 "Period-lite-$VN-android.apk" -R "$GITHUB_REPOSITORY" --clobber


      - name: Remove retired full APK and update download description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete only the explicitly retired full package, after verifying the replacement.
          FULL=$(gh release view android-v1.0.0 -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "Period-1.0.0-android.apk") | .name')
          if [ -n "$FULL" ]; then
            gh release delete-asset android-v1.0.0 "$FULL" -R "$GITHUB_REPOSITORY" --yes
          fi
          VN=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android-lite/android/app/build.gradle)
          cat > /tmp/android-release-notes.md <<EOF
          Android 仅提供轻量安装包（约 3.5 MB）。

          最新版本：**Period-lite-$VN-android.apk**，包含 V1.3 算法与 Android 自适应图标。

          沿用原版包名 com.period.app 与同一签名，versionCode 已递增。旧大安装包已停用并删除。
          EOF
          gh release edit android-v1.0.0 -R "$GITHUB_REPOSITORY" --title "Period Android" --notes-file /tmp/android-release-notes.md
