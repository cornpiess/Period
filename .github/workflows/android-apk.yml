name: Android APK Release

on:
  workflow_dispatch:

jobs:
  # 轻量壳（Capacitor，纯系统 WebView，~5MB）：日常发布用这个
  lite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-lite/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: cd android-lite && npm ci

      - name: Sync PWA into native project
        run: cd android-lite && npx cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-lite/android/app/period.keystore

      - name: Inject release signing config
        run: |
          cat >> android-lite/android/app/build.gradle <<'EOF'

          // CI signing config appended by workflow
          android {
              signingConfigs {
                  release {
                      storeFile file("period.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android-lite/android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls android-lite/android/app/build/outputs/apk/release/*.apk | head -1)
          SIZE=$(du -m "$APK" | cut -f1)
          gh release view android-v1.0.0 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-v1.0.0 -R "$GITHUB_REPOSITORY" \
              --title "Period Android v1.0.0" \
              --notes "轻量版 APK（Capacitor WebView 壳）。"
          gh release upload android-v1.0.0 "$APK#Period-lite-1.0.1-android.apk" -R "$GITHUB_REPOSITORY" --clobber
          echo "uploaded $SIZE MB"

  # Expo 全功能壳（RN 运行时，~66MB）：保留作为备用
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild -p android --no-install

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/period.keystore
          ls -la android/app/period.keystore

      - name: Inject release signing config
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // CI signing config appended by workflow
          android {
              signingConfigs {
                  release {
                      storeFile file("period.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "Period-$VERSION-android.apk"
          ls -la Period-*.apk

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="android-v$VERSION"
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "Period Android v$VERSION" \
              --notes "Android APK v$VERSION. 直接下载 Period-$VERSION-android.apk 安装（需允许安装未知来源应用）。"
          gh release upload "$TAG" "Period-$VERSION-android.apk" -R "$GITHUB_REPOSITORY" --clobber
