name: iOS Build to TestFlight
# Native releases build the lightweight Swift shell.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:
jobs:
  testflight:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[pwa-only]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate lightweight iOS project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: node ios-lite/generate-project.cjs
      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: fastlane ios testflight
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Period-iOS-IPA
          path: Period.ipa
